*{box-sizing:border-box}
body{background-color:var(--paper);background-image:var(--canvas);color:var(--ink);font:400 16px/1.55 var(--body);padding-inline:clamp(16px,4vw,40px);-webkit-text-size-adjust:100%}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background-color:var(--paper);background-image:var(--canvas);border-bottom:4px solid var(--line);margin-inline:calc(-1*clamp(16px,4vw,40px));padding-inline:clamp(16px,4vw,40px)}

function mean(a){let s=0;for(const v of a)s+=v;return s/a.length}
function sd(a){const m=mean(a);let s=0;for(const v of a)s+=(v-m)*(v-m);return Math.sqrt(s/(a.length-1))}
function metrics(ints,rfInts,flags){
  const n=ints.length,q=ints.map(v=>v/1e5),e=q.map((v,i)=>v-rfInts[i]/1e5);
  const mq=mean(q),me=mean(e),vol=sd(q)*2,ae=Math.pow(1+me,4)-1;
  const neg=e.filter(v=>v<0),dsd=neg.length>1?sd(neg)*2:NaN;
  const k=Math.ceil(0.05*n-1e-9),cvar=mean([...e].sort((a,b)=>a-b).slice(0,k));
  let w=1,pk=1,dd=0;const wealth=[],draw=[];
  for(const v of q){w*=1+v;pk=Math.max(pk,w);const d=w/pk-1;dd=Math.min(dd,d);wealth.push(w);draw.push(d)}
  const cq=q.filter((_,i)=>flags[i]===1),nq=q.filter((_,i)=>flags[i]===0);
  return {annReturn:Math.pow(1+mq,4)-1,annVol:vol,annExcess:ae,sharpe:ae/vol,sortino:ae/dsd,cvar,maxDD:dd,
    crisisMean:cq.length?mean(cq):NaN,normalMean:nq.length?mean(nq):NaN,crisisN:cq.length,normalN:nq.length,wealth,draw,endWealth:w};
}

function insertRec(){
  const w=document.querySelector('#story .wrap');if(!w||document.getElementById('rec'))return;
  w.insertAdjacentHTML('afterbegin',recHtml());
  document.getElementById('reccopy').addEventListener('click',async()=>{const st=document.getElementById('recstat');

}

  const HINTS={};
  const radio=(name,items,cur,cls='')=>{HINTS[name]=Object.fromEntries(items.map(([v,l,h])=>[v,h||'']));return `<div class="opts ${cls}" role="radiogroup">${items.map(([v,l,h])=>`<label class="opt${v===cur?' on':''}"><input type="radio" name="${name}" value="${v}"${v===cur?' checked':''}><span>${l}</span></label>`).join('')}</div>${['cost','crisis'].includes(name)?`<p class="hint gh" id="gh-${name}">${HINTS[name][cur]}</p>`:''}`};
  const goals=Object.keys(GOALS).map(k=>[k,term(GLOSS[k],t('goals.'+k+'.0'))]);
  const costs=D.costs.map(c=>[c,t('costs.'+c+'.0'),t('costs.'+c+'.1')]);
  const stress=['main','t20','t10'].map(c=>[c,t('stress.'+c+'.0'),t('stress.'+c+'.1')]);
